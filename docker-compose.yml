services:
  mysql:
    image: mysql:latest
    container_name: trybe-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_VOLUME_PATH}:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: "trybe-redis"
    volumes:
      - ${REDIS_VOLUME_PATH}:/data
    ports:
      - "${REDIS_PORT}:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: trybe-zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    container_name: trybe-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:${KAFKA_PORT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}

  jenkins:
    container_name: trybe-jenkins
    image: jenkins/jenkins
    volumes:
      - ${JENKINS_VOLUME_PATH}:/var/jenkins_home
    ports:
      - "${JENKINS_PORT}:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: trybe-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH}:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: trybe-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: always
    depends_on:
      - prometheus

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: trybe-mysql-exporter
    ports:
      - "${MYSQL_EXPORTER_PORT}:9104"
    command:
      - "--mysqld.username=${MYSQL_EXPORTER_USER}"
      - "--mysqld.address=${MYSQL_EXPORTER_ADDRESS}"
    restart: always
    depends_on:
      - mysql

  loki:
    image: grafana/loki:latest
    container_name: trybe-loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ${LOKI_VOLUME_PATH}

